<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700"><rect x="0" y="0" width="1300" height="700" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="40" y="48" font-size="20" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Audit de vulnérabilités — la chaîne complète</text><text x="40" y="74" font-size="12" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">De la station d'audit à la preuve : six étapes, deux scans, deux remédiations.</text><rect x="40" y="110" width="186" height="150" rx="9" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="54" y="138" font-size="11.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">1 · Station d'audit</text><text x="54" y="157" font-size="9.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Hors plage d'attribution</text><text x="54" y="196" font-size="14.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">6 Go · 45 Go</text><text x="54" y="224" font-size="9.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">segment commun</text><rect x="246" y="110" width="186" height="150" rx="9" fill="#f7faf8" stroke="#5b6570" stroke-width="1.5"/><text x="260" y="138" font-size="11.5" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2 · Remédiation SSH</text><text x="260" y="157" font-size="9.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Faite avant le scan</text><text x="260" y="190" font-size="14.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">6 → 3</text><text x="260" y="205" font-size="9" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">tentatives</text><text x="260" y="228" font-size="9.5" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">appliquée avant</text><rect x="452" y="110" width="186" height="150" rx="9" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="466" y="138" font-size="11.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">3 · Inventaire Nmap</text><text x="466" y="157" font-size="9.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Quatre ports ouverts</text><text x="466" y="196" font-size="14.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">4 ports</text><text x="466" y="224" font-size="9.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">65 531 fermés</text><rect x="658" y="110" width="186" height="150" rx="9" fill="#f7faf8" stroke="#5b6570" stroke-width="1.5"/><text x="672" y="138" font-size="11.5" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">4 · Premier scan</text><text x="672" y="157" font-size="9.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">OpenVAS, avant correction</text><text x="672" y="196" font-size="14.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">29 minutes</text><text x="672" y="224" font-size="9.5" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">54 résultats</text><rect x="864" y="110" width="186" height="150" rx="9" fill="#f7faf8" stroke="#c08a2e" stroke-width="1.5"/><text x="878" y="138" font-size="11.5" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">5 · Remédiation SSH</text><text x="878" y="157" font-size="9.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Désignée par le scan</text><text x="878" y="190" font-size="14.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">10 → 6</text><text x="878" y="205" font-size="9" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">algorithmes MAC</text><text x="878" y="228" font-size="9.5" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">prouvées</text><rect x="1070" y="110" width="186" height="150" rx="9" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="1084" y="138" font-size="11.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">6 · Second scan</text><text x="1084" y="157" font-size="9.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">OpenVAS, après correction</text><text x="1084" y="196" font-size="14.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">21 minutes</text><text x="1084" y="224" font-size="9.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">résultat disparu</text><line x1="228" y1="185" x2="244" y2="185" stroke="#c08a2e" stroke-width="2.5"/><polygon points="244,185 236,180.5 236,189.5" fill="#c08a2e"/><line x1="434" y1="185" x2="450" y2="185" stroke="#c08a2e" stroke-width="2.5"/><polygon points="450,185 442,180.5 442,189.5" fill="#c08a2e"/><line x1="640" y1="185" x2="656" y2="185" stroke="#c08a2e" stroke-width="2.5"/><polygon points="656,185 648,180.5 648,189.5" fill="#c08a2e"/><line x1="846" y1="185" x2="862" y2="185" stroke="#c08a2e" stroke-width="2.5"/><polygon points="862,185 854,180.5 854,189.5" fill="#c08a2e"/><line x1="1052" y1="185" x2="1068" y2="185" stroke="#c08a2e" stroke-width="2.5"/><polygon points="1068,185 1060,180.5 1060,189.5" fill="#c08a2e"/><text x="40" y="296" font-size="14" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Ce que chaque scan couvre, et ce qu'il ne couvre pas</text><text x="40" y="318" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Seule la remédiation désignée par le premier scan est vérifiable par le second. L'autre est prouvée par la configuration du service.</text><rect x="40" y="340" width="590" height="300" rx="9" fill="#f7faf8" stroke="#5b6570" stroke-width="1.5"/><text x="64" y="372" font-size="13" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Premier scan — 29 minutes, 54 résultats</text><text x="64" y="406" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Proxmox VE End of Life</text><text x="490" y="406" font-size="11.5" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">10,0</text><text x="600" y="406" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">critique</text><text x="64" y="440" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">TCP Timestamps</text><text x="490" y="440" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2,6</text><text x="600" y="440" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">basse</text><text x="64" y="474" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Weak MAC Algorithm(s) SSH</text><text x="490" y="474" font-size="11.5" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2,6</text><text x="600" y="474" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">basse</text><text x="64" y="508" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">ICMP Timestamp</text><text x="490" y="508" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2,1</text><text x="600" y="508" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">basse</text><text x="64" y="542" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Observations sans gravité</text><text x="490" y="542" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">0,0</text><text x="600" y="542" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">log</text><text x="64" y="600" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">3 résultats non nuls. Le scan ne dit rien des tentatives SSH :</text><text x="64" y="618" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">ce réglage n'est pas de son périmètre.</text><rect x="670" y="340" width="590" height="300" rx="9" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="694" y="372" font-size="13" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Second scan — 21 minutes, après correction</text><text x="694" y="406" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Proxmox VE End of Life</text><text x="1120" y="406" font-size="11.5" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">10,0</text><text x="1230" y="406" font-size="10.5" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">critique</text><text x="694" y="440" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">TCP Timestamps</text><text x="1120" y="440" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2,6</text><text x="1230" y="440" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">basse</text><text x="694" y="474" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Weak MAC Algorithm(s) SSH</text><text x="1120" y="474" font-size="11.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">—</text><text x="1230" y="474" font-size="10.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">disparu</text><text x="694" y="508" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">ICMP Timestamp</text><text x="1120" y="508" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2,1</text><text x="1230" y="508" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">basse</text><text x="694" y="542" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Observations sans gravité</text><text x="1120" y="542" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">0,0</text><text x="1230" y="542" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">log</text><text x="694" y="600" font-size="10.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Le résultat visé a disparu. Les autres sont inchangés.</text><line x1="630" y1="484" x2="668" y2="484" stroke="#2e6a4f" stroke-width="2.5"/><polygon points="668,484 660,479.5 660,488.5" fill="#2e6a4f"/><text x="650" y="470" font-size="9" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">même</text><text x="650" y="508" font-size="9" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">cible</text><rect x="40" y="660" width="1220" height="26" rx="6" fill="#fdf6e6" stroke="#c08a2e" stroke-width="1"/><text x="56" y="677" font-size="10.5" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">6 → 3 (tentatives SSH) est vérifié par sshd -T, pas par OpenVAS. 10 → 6 (algorithmes) est vérifié par les deux.</text></svg>