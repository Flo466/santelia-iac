<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700"><rect x="0" y="0" width="1300" height="700" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="40" y="48" font-size="20" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Audit de vulnérabilités — la chaîne complète</text><text x="40" y="74" font-size="12" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">D'une station dédiée à la preuve que la correction tient : cinq étapes, deux scans.</text><rect x="40" y="110" width="236" height="150" rx="9" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="58" y="140" font-size="12.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">1 · Station d'audit</text><text x="58" y="162" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Machine dédiée, hors plage</text><text x="58" y="200" font-size="17" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">6 Gio · 45 Gio</text><text x="58" y="226" font-size="10.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">segment commun</text><rect x="296" y="110" width="236" height="150" rx="9" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="314" y="140" font-size="12.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2 · Inventaire</text><text x="314" y="162" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" f