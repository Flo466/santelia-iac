rif" font-weight="normal" text-anchor="start">Le scan de contrôle ne remonte plus la faiblesse corrigée. Deux sources indépendantes le confirment :</text><text x="40" y="334" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">l'énumération directe des algorithmes négociés, et l'outil de détection lui-même.</text><rect x="40" y="356" width="590" height="300" rx="9" fill="#f7faf8" stroke="#5b6570" stroke-width="1.5"/><text x="64" y="388" font-size="13" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Premier scan — 54 résultats</text><text x="64" y="422" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Proxmox VE End of Life</text><text x="490" y="422" font-size="11.5" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">10,0</text><text x="600" y="422" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">critique</text><text x="64" y="458" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">TCP Timestamps</text><text x="490" y="458" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">2,6</text><text x="600" y="458" font-size="10.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="end">basse</text><text x="64" y="494" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-w