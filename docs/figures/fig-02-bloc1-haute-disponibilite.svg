<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900"><rect x="0" y="0" width="1300" height="900" rx="8" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="40" y="50" font-size="20" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Brique 01 — haute disponibilité, logique de fonctionnement</text><text x="40" y="76" font-size="12" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Trois nœuds, quorum à deux sur trois, réplication des volumes, bascule mesurée à 2 min 24 s.</text><rect x="700" y="95" width="12" height="12" rx="3" fill="#2e6a4f" stroke="#2e6a4f" stroke-width="1"/><text x="718" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">En service</text><rect x="798.0" y="95" width="12" height="12" rx="3" fill="#7aa87c" stroke="#7aa87c" stroke-width="1"/><text x="816.0" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Secours / copie</text><rect x="927.0" y="95" width="12" height="12" rx="3" fill="#5b6570" stroke="#5b6570" stroke-width="1"/><text x="945.0" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Passif</text><rect x="1000.2" y="95" width="12" height="12" rx="3" fill="#c08a2e" stroke="#c08a2e" stroke-width="1"/><text x="1018.2" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Flux / tâche</text><rect x="1110.6000000000001" y="95" width="12" height="12" rx="3" fill="#9c3b32" stroke="#9c3b32" stroke-width="1"/><text x="1128.6000000000001" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Écart</text><rect x="40" y="150" width="1220" height="440" rx="8" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="64" y="182" font-size="14" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Serveur physique — hôte Proxmox VE</text><text x="64" y="204" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">6 cœurs / 6 threads  ·  23 Go de mémoire  ·  virtualisation imbriquée active</text><rect x="70" y="230" width="1160" height="320" rx="8" fill="#f7faf8" stroke="#7aa87c" stroke-width="1.5" stroke-dasharray="6 4"/><text x="650" y="258" font-size="12" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">Cluster Santélia — quorum natif à deux votes sur trois</text><rect x="120" y="280" width="300" height="120" rx="8" fill="#e8f2ea" stroke="#2e6a4f" stroke-width="1.5"/><text x="270" y="315" font-size="15" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">pve-a</text><text x="270" y="338" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">nœud principal</text><text x="270" y="368" font-size="11" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">héberge la machine critique</text><rect x="500" y="280" width="300" height="120" rx="8" fill="#f2f8f0" stroke="#7aa87c" stroke-width="1.5"/><text x="650" y="315" font-size="15" fill="#7aa87c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">pve-b</text><text x="650" y="338" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">nœud secondaire</text><text x="650" y="368" font-size="11" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">reprise en cas de panne</text><rect x="880" y="280" width="300" height="120" rx="8" fill="#eef0f2" stroke="#5b6570" stroke-width="1.5"/><text x="1030" y="315" font-size="15" fill="#5b6570" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">pve-c</text><text x="1030" y="338" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">votant de quorum</text><text x="1030" y="368" font-size="11" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">n'héberge aucune charge</text><line x1="420" y1="340" x2="500" y2="340" stroke="#c08a2e" stroke-width="2"/><polygon points="500,340 491,336 491,344" fill="#c08a2e"/><text x="460" y="326" font-size="10" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">réplication</text><text x="460" y="360" font-size="10" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">15 min</text><text x="64" y="500" font-size="12" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Lecture</text><text x="64" y="522" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Un nœud tombe : le cluster reste quorate, la machine redémarre sur un nœud survivant.</text><text x="64" y="542" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Le quorum à deux votes sur trois permet la reprise sans dispositif externe de vote.</text><rect x="40" y="620" width="620" height="250" rx="8" fill="#f7faf8" stroke="#c08a2e" stroke-width="1.5"/><text x="64" y="652" font-size="14" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Déroulé mesuré de la bascule</text><rect x="70" y="676" width="560" height="30" rx="6" fill="#fdf6e6" stroke="#c08a2e" stroke-width="1.5"/><text x="86" y="696" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Coupure du nœud</text><rect x="70" y="714" width="560" height="30" rx="6" fill="#fdf6e6" stroke="#c08a2e" stroke-width="1.5"/><text x="86" y="734" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Détection de la perte — 6 s</text><rect x="70" y="752" width="560" height="30" rx="6" fill="#fdf6e6" stroke="#c08a2e" stroke-width="1.5"/><text x="86" y="772" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Décision de reprise — 2 min 06</text><rect x="70" y="790" width="560" height="30" rx="6" fill="#e8f2ea" stroke="#2e6a4f" stroke-width="1.5"/><text x="86" y="810" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Service joignable — 2 min 24</text><text x="70" y="844" font-size="10.5" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">144 secondes d'indisponibilité au total.</text><rect x="690" y="620" width="570" height="250" rx="8" fill="#fbeeec" stroke="#9c3b32" stroke-width="1.5"/><text x="714" y="652" font-size="14" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">L'écart assumé</text><text x="714" y="678" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Les trois nœuds partagent un seul châssis physique.</text><text x="714" y="700" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">La maquette démontre le mécanisme de quorum, de</text><text x="714" y="720" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">réplication et de bascule — pas la résistance à la</text><text x="714" y="740" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">panne de l'hôte lui-même.</text><text x="714" y="772" font-size="11" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Cet écart est déclaré dans le document d'architecture,</text><text x="714" y="792" font-size="11" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">parce qu'une recette doit rester défendable.</text></svg>