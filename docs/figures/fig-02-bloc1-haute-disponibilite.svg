<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="870" viewBox="0 0 1300 870">
<rect width="1300" height="870" fill="#ffffff"/>
<text x="40" y="50" font-size="20" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Brique 01 — haute disponibilité, logique de fonctionnement</text>
<text x="40" y="76" font-size="12" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Trois nœuds, quorum à deux sur trois, réplication des volumes, bascule mesurée à 2 min 24 s.</text>
<rect x="40" y="110" width="1180" height="470" rx="8" fill="#f1f7ed" stroke="#2f6b45" stroke-width="1.5"/>
<text x="64" y="140" font-size="14" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Serveur physique — hôte Proxmox VE</text>
<rect x="70" y="160" width="1120" height="270" rx="8" fill="#f1f7ed" stroke="#b7d0a6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="630" y="186" font-size="12" fill="#1c3c26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">Cluster Santélia — quorum natif à deux votes sur trois</text>
<rect x="120" y="210" width="250" height="120" rx="8" fill="#ffffff" stroke="#2f6b45" stroke-width="1.5"/>
<text x="245.0" y="248" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">pve-a</text>
<text x="245.0" y="265" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">nœud principal</text>
<text x="245.0" y="281" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle"></text>
<text x="245.0" y="297" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">machine critique</text>
<rect x="480" y="210" width="250" height="120" rx="8" fill="#ffffff" stroke="#2f6b45" stroke-width="1.5"/>
<text x="605.0" y="248" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">pve-b</text>
<text x="605.0" y="265" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">nœud secondaire</text>
<text x="605.0" y="281" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle"></text>
<text x="605.0" y="297" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">reprise de la machine</text>
<rect x="840" y="210" width="250" height="120" rx="8" fill="#ffffff" stroke="#2f6b45" stroke-width="1.5"/>
<text x="965.0" y="248" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">pve-c</text>
<text x="965.0" y="265" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">votant de quorum</text>
<text x="965.0" y="281" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle"></text>
<text x="965.0" y="297" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">n'héberge aucune charge</text>
<rect x="120" y="350" width="250" height="60" rx="8" fill="#eaf3e4" stroke="#b7d0a6" stroke-width="1.5"/>
<text x="245.0" y="383" font-size="11" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">Machine critique — service témoin</text>
<rect x="480" y="350" width="250" height="60" rx="8" fill="#eaf3e4" stroke="#b7d0a6" stroke-width="1.5"/>
<text x="605.0" y="383" font-size="11" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">Réplication des volumes</text>
<line x1="370" y1="380" x2="480" y2="380" stroke="#2f6b45" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="425" y="372" font-size="10" fill="#1c3c26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">réplication continue</text>
<rect x="90" y="450" width="1080" height="110" rx="8" fill="#f1f7ed" stroke="#2f6b45" stroke-width="1.5"/>
<text x="110" y="478" font-size="12" fill="#1c3c26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Lecture</text>
<text x="110" y="502" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Perte d'un nœud : le cluster reste quorate, la machine redémarre sur un nœud survivant.</text>
<text x="110" y="524" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Le quorum à deux votes sur trois est ce qui permet la reprise sans dispositif externe.</text>
<rect x="40" y="610" width="560" height="220" rx="8" fill="#f1f7ed" stroke="#2f6b45" stroke-width="1.5"/>
<text x="64" y="640" font-size="14" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Déroulé mesuré de la bascule</text>
<rect x="70" y="660" width="500" height="30" rx="6" fill="#eaf3e4" stroke="#b7d0a6" stroke-width="1.5"/>
<text x="84" y="680" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Coupure du nœud</text>
<rect x="70" y="698" width="500" height="30" rx="6" fill="#eaf3e4" stroke="#b7d0a6" stroke-width="1.5"/>
<text x="84" y="718" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Détection de la perte — 6 secondes</text>
<rect x="70" y="736" width="500" height="30" rx="6" fill="#eaf3e4" stroke="#b7d0a6" stroke-width="1.5"/>
<text x="84" y="756" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Décision de reprise — 2 min 06</text>
<rect x="70" y="774" width="500" height="30" rx="6" fill="#e3efdb" stroke="#2f6b45" stroke-width="1.5"/>
<text x="84" y="794" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Service de nouveau joignable — 2 min 24</text>
<text x="640" y="640" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">La limite assumée</text>
<text x="640" y="664" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Les trois nœuds partagent un seul châssis. La maquette</text>
<text x="640" y="684" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">démontre le mécanisme de quorum et de bascule, pas la</text>
<text x="640" y="704" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">résistance à une panne matérielle. Ce point est écrit</text>
<text x="640" y="724" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">dans le dossier d'exploitation plutôt que masqué.</text>
</svg>
