<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780"><rect x="0" y="0" width="1300" height="780" rx="8" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="40" y="50" font-size="20" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Brique 02 — sauvegarde, stratégie 3-2-1</text><text x="40" y="76" font-size="12" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Trois copies, deux supports distincts, une hors du premier support. Les trois sont en place.</text><rect x="700" y="95" width="12" height="12" rx="3" fill="#2e6a4f" stroke="#2e6a4f" stroke-width="1"/><text x="718" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">En service</text><rect x="798.0" y="95" width="12" height="12" rx="3" fill="#7aa87c" stroke="#7aa87c" stroke-width="1"/><text x="816.0" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Secours / copie</text><rect x="927.0" y="95" width="12" height="12" rx="3" fill="#5b6570" stroke="#5b6570" stroke-width="1"/><text x="945.0" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Passif</text><rect x="1000.2" y="95" width="12" height="12" rx="3" fill="#c08a2e" stroke="#c08a2e" stroke-width="1"/><text x="1018.2" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Flux / tâche</text><rect x="1110.6000000000001" y="95" width="12" height="12" rx="3" fill="#9c3b32" stroke="#9c3b32" stroke-width="1"/><text x="1128.6000000000001" y="106" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Écart</text><text x="40" y="130" font-size="13" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Les trois copies</text><rect x="40" y="150" width="380" height="260" rx="8" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="60" y="180" font-size="13" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Copie 1 — donnée vivante</text><rect x="60" y="200" width="340" height="86" rx="6" fill="#e8f2ea" stroke="#2e6a4f" stroke-width="1.5"/><text x="230" y="232" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">Volumes du cluster</text><text x="230" y="250" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">Répliqués entre nœuds</text><text x="230" y="268" font-size="10" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">En place</text><text x="60" y="316" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Ne protège pas de la perte de données :</text><text x="60" y="336" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">la réplication propage aussi les erreurs.</text><rect x="450" y="150" width="380" height="260" rx="8" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="470" y="180" font-size="13" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Copie 2 — sauvegarde primaire</text><rect x="470" y="200" width="340" height="86" rx="6" fill="#e8f2ea" stroke="#2e6a4f" stroke-width="1.5"/><text x="640" y="232" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">PBS01</text><text x="640" y="250" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">Entrepôt dédupliqué</text><text x="640" y="268" font-size="10" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">En place</text><text x="470" y="316" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Sur le serveur physique. Deux sauvegardes</text><text x="470" y="336" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">par jour, sans interruption de service.</text><rect x="860" y="150" width="380" height="260" rx="8" fill="#f7faf8" stroke="#7aa87c" stroke-width="1.5"/><text x="880" y="180" font-size="13" fill="#7aa87c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Copie 3 — hors premier support</text><rect x="880" y="200" width="340" height="86" rx="6" fill="#f2f8f0" stroke="#7aa87c" stroke-width="1.5"/><text x="1050" y="232" font-size="12" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">PBS02</text><text x="1050" y="250" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">Machine physique distincte</text><text x="1050" y="268" font-size="10" fill="#7aa87c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="middle">En place</text><text x="880" y="316" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Copie tirée quatre fois par jour,</text><text x="880" y="336" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">la première 30 min après la sauvegarde.</text><line x1="420" y1="280" x2="450" y2="280" stroke="#c08a2e" stroke-width="2"/><polygon points="450,280 441,276 441,284" fill="#c08a2e"/><text x="435" y="266" font-size="9" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">sauvegarde</text><line x1="830" y1="280" x2="860" y2="280" stroke="#c08a2e" stroke-width="2"/><polygon points="860,280 851,276 851,284" fill="#c08a2e"/><text x="845" y="266" font-size="9" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="middle">copie</text><rect x="40" y="440" width="600" height="300" rx="8" fill="#f7faf8" stroke="#2e6a4f" stroke-width="1.5"/><text x="64" y="472" font-size="14" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Mesures relevées</text><text x="64" y="500" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Sauvegarde</text><text x="280" y="500" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">12 s puis 9 s</text><text x="64" y="532" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Déduplication</text><text x="280" y="532" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">82 %, puis 98 % réutilisé</text><text x="64" y="564" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Restauration</text><text x="280" y="564" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">9,27 s à 884 Mo/s</text><text x="64" y="596" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Cohérence</text><text x="280" y="596" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">agent invité, gel puis libération</text><text x="64" y="628" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Copie, 1re passe</text><text x="280" y="628" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">442,898 Mio en 363 blocs</text><text x="64" y="660" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Copie, 2e passe</text><text x="280" y="660" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">16,43 Mio en 32 blocs</text><text x="64" y="692" font-size="11.5" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Points de vigilance</text><text x="280" y="692" font-size="11.5" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">8, documentés</text><rect x="670" y="440" width="590" height="300" rx="8" fill="#f7faf8" stroke="#c08a2e" stroke-width="1.5"/><text x="694" y="472" font-size="14" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Deux pertes, deux cibles</text><text x="694" y="504" font-size="11.5" fill="#2e6a4f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Perte de disponibilité</text><text x="694" y="524" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Réplication entre nœuds</text><text x="694" y="544" font-size="13" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">15 min au pire</text><text x="694" y="564" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Rétablissement en 2 min 24 s</text><text x="694" y="596" font-size="11.5" fill="#9c3b32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">Perte de récupération</text><text x="694" y="616" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Sauvegarde et copie secondaire</text><text x="694" y="636" font-size="13" fill="#14180f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="bold" text-anchor="start">12 h 30 au pire</text><text x="694" y="656" font-size="11" fill="#4d5648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Restauration mesurée à 9,27 s</text><text x="694" y="692" font-size="10.5" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">La fréquence de copie ne réduit pas la perte : elle en réduit le délai de propagation.</text><text x="694" y="712" font-size="10.5" fill="#c08a2e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-weight="normal" text-anchor="start">Le maillon le plus lent, la sauvegarde, commande.</text></svg>